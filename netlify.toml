[build]
  publish = "."

# Pages are served as phelps.html etc. -> /phelps (pretty URLs on by default)
[[redirects]]
  from = "https://pearsonbuilding.co.uk/*"
  to = "https://www.pearsonbuilding.co.uk/:splat"
  status = 301
  force = true

# Serve each page at one URL only (no /phelps.html duplicates)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/phelps.html"
  to = "/phelps"
  status = 301

[[redirects]]
  from = "/project-videos.html"
  to = "/project-videos"
  status = 301

[[redirects]]
  from = "/tanners-farm-house.html"
  to = "/tanners-farm-house"
  status = 301

[[redirects]]
  from = "/castle-hill-new-build.html"
  to = "/castle-hill-new-build"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/editor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/libs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/feed/atom"
  [headers.values]
    Content-Type = "application/atom+xml; charset=UTF-8"

[[headers]]
  for = "/feed/rss2"
  [headers.values]
    Content-Type = "text/xml; charset=UTF-8"
